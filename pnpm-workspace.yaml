packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted
enablePrePostScripts: true

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  "better-sqlite3": true
  "electron": true
  "esbuild": true
  "msw": true
  "node-pty": true
  "protobufjs": true
  "sharp": true
  "sqlite3": true
  "unrs-resolver": true
  "workerd": true
